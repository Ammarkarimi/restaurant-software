services:
  postgres:
    image: postgres:16-alpine
    container_name: restaurant-manager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: restaurant
      POSTGRES_PASSWORD: restaurant
      POSTGRES_DB: restaurant_manager
    ports:
      - "5432:5432"
    volumes:
      - restaurant_manager_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant -d restaurant_manager"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  restaurant_manager_postgres_data:
